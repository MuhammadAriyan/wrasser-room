<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>wrasser - Bold Ideas</title>
  <style>
    :root {
      --bg-color: #e5e5e3;
      --text-main: #111111;
      --text-muted: #555555;
      --btn-bg: #0d0d0d;
      --btn-text: #ffffff;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 4rem;
      text-align: center;
    }

    /* Navigation */
    header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--text-main);
    }

    nav {
      display: flex;
      gap: 2rem;
    }

    nav a {
      text-decoration: none;
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .auth-actions {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .auth-actions a {
      text-decoration: none;
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .btn-small {
      background-color: var(--btn-bg);
      color: var(--btn-text);
      padding: 0.5rem 1.25rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
    }

    /* Hero Section */
    .hero {
      max-width: 650px;
      margin-top: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    .hero h1 {
      font-size: 3.5rem;
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .hero p {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.5;
      max-width: 500px;
    }

    .cta-btn {
      margin-top: 0.5rem;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      padding: 0.8rem 1.8rem;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Footer / Logos Section */
    footer {
      width: 100%;
      max-width: 1200px;
      margin-top: 8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    footer p {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .logo-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0.8;
      font-weight: 700;
      font-size: 0.9rem;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      body {
        padding: 1.5rem 1.5rem;
      }

      nav {
        display: none;
      }

      .hero h1 {
        font-size: 2.25rem;
      }

      .logo-bar {
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- Header Navigation -->
  <header>
    <a href="mailto:thewrasser@gmail.com" class="brand">WRASSER®</a>
    <nav>
      <a href="#">Insights</a>
      <a href="#">Solutions</a>
      <a href="#">Pricing</a>
    </nav>
    <div class="auth-actions">
      <a href="#">Login</a>
      <a href="mailto:thewrasser@gmail.com" class="btn-small">Try Now</a>
    </div>
  </header>

  <!-- Hero Content -->
  <main class="hero">
    <h1>Bold Ideas That<br>Start With Vision.</h1>
    <p>We help modern brands craft digital stories that inspire action and drive results.</p>
    <a href="mailto:thewrasser@gmail.com" class="cta-btn">
      Get In Touch ↗
    </a>
  </main>

  <!-- Brands/Logos Footer -->
  <footer>
    <p>Trusted by teams of every scale</p>
    <div class="logo-bar">
      <span>MERCURY</span>
      <span>ramp ↗</span>
      <span>HEX</span>
      <span>▲ Vercel</span>
      <span>descript</span>
      <span>Cash App</span>
      <span>runway</span>
    </div>
  </footer>

</body>
</html>
